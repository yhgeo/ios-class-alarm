name: AlarmPoC
options:
  bundleIdPrefix: com.yhgeo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  AlarmPoC:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yhgeo.alarmpoc
        PRODUCT_NAME: AlarmPoC
        INFOPLIST_FILE: Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_ENABLE_OBJC_ARC: YES
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"

schemes:
  AlarmPoC:
    build:
      targets:
        AlarmPoC: all
    run:
      config: Release
    archive:
      config: Release
