name: Build XiangKe IPA

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'DEVELOPMENT.md'
      - '.gitignore'
      - '.workbuddy-ai/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Compile with clang
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDK"
          APP="out/Payload/XiangKe.app"
          mkdir -p "$APP"
          SOURCES=$(find Sources -name '*.m' -print | sort | tr '\n' ' ')
          echo "源文件: $SOURCES"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=16.0 \
            -fobjc-arc \
            -O1 \
            -ISources \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework UniformTypeIdentifiers \
            -framework Security \
            -o "$APP/XiangKe" \
            $SOURCES
          cp Sources/Info.plist "$APP/Info.plist"
          cp Resources/AppIcon*.png "$APP/"
          printf 'APPL????' > "$APP/PkgInfo"
          echo "--- app bundle ---"
          ls -la "$APP"
          file "$APP/XiangKe"

      - name: Inject entitlements and package IPA
        run: |
          set -euo pipefail
          APP="out/Payload/XiangKe.app"
          ldid -Sentitlements.plist "$APP/XiangKe"
          echo "----- applied entitlements -----"
          ldid -e "$APP/XiangKe"
          rm -f out/XiangKe.ipa
          cd out
          zip -qry XiangKe.ipa Payload
          ls -lh XiangKe.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiangKe-ipa
          path: out/XiangKe.ipa
          retention-days: 30
