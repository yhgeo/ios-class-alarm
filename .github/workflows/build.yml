name: Build XiangKe IPA

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'DEVELOPMENT.md'
      - '.gitignore'
      - '.workbuddy-ai/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Compile ObjC + Swift
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDK"
          xcodebuild -version || true

          APP="out/Payload/XiangKe.app"
          OBJ="build/obj"
          rm -rf build
          mkdir -p "$APP" "$OBJ"

          # ---------- 1) ObjC → .o ----------
          # 改为逐个编译：Swift 那部分要单独编译，最后一起链接
          for f in $(find Sources -name '*.m' -print | sort); do
            echo "  clang $(basename "$f")"
            xcrun --sdk iphoneos clang \
              -arch arm64 -isysroot "$SDK" \
              -miphoneos-version-min=16.0 -fobjc-arc -O1 -ISources \
              -c "$f" -o "$OBJ/$(basename "$f" .m).o"
          done

          # ---------- 2) Swift → .o ----------
          # App Intents 的元数据**必须**由编译器产出的常量值 sidecar 驱动
          # （处理器会明确报错：No swift const values found ... cannot be extracted）。
          # 该 flag 在不同 Xcode 版本上写法不一，且可能被接受却什么都不写 ——
          # 所以判断依据是「文件是否真的出现」，并且依次试几种写法。
          echo "===== swift-frontend 中 const-value 相关选项 ====="
          xcrun --sdk iphoneos swift-frontend -help-hidden 2>&1 | grep -i "const-value" || echo "(无匹配)"
          echo "================================================="

          CV="$OBJ/XiangKeIntent.swiftconstvalues"
          PROTOS="AppIntent AppEntity EntityQuery AppEnum AppShortcutsProvider AppShortcutProviding AppIntentsPackage DynamicOptionsProvider AnyResolverProviding TransientEntity"

          gen_sidecar() {
            label="$1"; shift
            rm -f "$OBJ/XiangKeIntent.o" "$CV"
            xcrun --sdk iphoneos swiftc \
              -target arm64-apple-ios16.0 -sdk "$SDK" \
              -module-name XiangKe -parse-as-library \
              "$@" -c Sources/XiangKeIntent.swift -o "$OBJ/XiangKeIntent.o" \
              >/dev/null 2>&1 || true

            for cand in "$CV" "$OBJ/XiangKeIntent.o.swiftconstvalues" \
                        "$OBJ/XiangKeIntent.swiftconstvalues"; do
              if [ -f "$cand" ]; then
                if [ "$cand" != "$CV" ]; then cp -f "$cand" "$CV"; fi
                echo "✓ 常量值 sidecar 产出成功 ← 参数 [$label]"
                return 0
              fi
            done
            echo "· 参数 [$label] 未产出 sidecar"
            return 1
          }

          gen_sidecar "A driver -Xfrontend" \
              -Xfrontend -emit-const-values-path -Xfrontend "$CV" || true

          # 诊断：看驱动究竟怎么调前端（模式、是否带 -primary-file）
          if [ ! -f "$CV" ]; then
            echo "--- swiftc -### （前端真实命令行）---"
            xcrun --sdk iphoneos swiftc \
              -target arm64-apple-ios16.0 -sdk "$SDK" \
              -module-name XiangKe -parse-as-library \
              -Xfrontend -emit-const-values-path -Xfrontend "$CV" \
              -c Sources/XiangKeIntent.swift -o "$OBJ/XiangKeIntent.o" -### 2>&1 \
              | head -12 || true
          fi

          # B：直接调用 swift-frontend，带 -primary-file（Xcode 就是这么调的）
          if [ ! -f "$CV" ]; then
            echo "--- 尝试 B：直接调用 swift-frontend ---"
            rm -f "$OBJ/XiangKeIntent.o"
            xcrun --sdk iphoneos swift-frontend -frontend -c \
              -primary-file Sources/XiangKeIntent.swift \
              -target arm64-apple-ios16.0 -sdk "$SDK" \
              -module-name XiangKe -parse-as-library -swift-version 5 \
              -enable-objc-interop \
              -emit-const-values-path "$CV" \
              -o "$OBJ/XiangKeIntent.o" 2>&1 | head -15 || true
            if [ -f "$CV" ]; then echo "✓ B 成功"; else echo "· B 未产出"; fi
          fi

          # C：走输出文件映射（Xcode 的实际做法之一）
          if [ ! -f "$CV" ]; then
            echo "--- 尝试 C：output-file-map ---"
            printf '{\n  "Sources/XiangKeIntent.swift": {\n    "object": "%s",\n    "swiftconstvalues": "%s"\n  }\n}\n' \
              "$PWD/$OBJ/XiangKeIntent.o" "$PWD/$CV" > build/ofm.json
            cat build/ofm.json
            rm -f "$OBJ/XiangKeIntent.o"
            xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 -sdk "$SDK" \
              -module-name XiangKe -parse-as-library \
              -output-file-map build/ofm.json \
              -emit-const-values-path "$CV" \
              -c Sources/XiangKeIntent.swift 2>&1 | head -10 || true
            if [ -f "$CV" ]; then echo "✓ C 成功"; else echo "· C 未产出"; fi
          fi

          if [ ! -f "$OBJ/XiangKeIntent.o" ]; then
            echo "⚠️ 以上写法都没成功，退回普通编译"
            xcrun --sdk iphoneos swiftc \
              -target arm64-apple-ios16.0 -sdk "$SDK" \
              -module-name XiangKe -parse-as-library \
              -c Sources/XiangKeIntent.swift -o "$OBJ/XiangKeIntent.o"
          fi

          if [ -f "$CV" ]; then
            echo "--- sidecar 内容（前 40 行）---"
            head -40 "$CV" || true
          else
            echo "⚠️ 最终仍无 sidecar —— 元数据提取大概率会失败"
          fi

          echo "--- objects ---"
          ls -la "$OBJ"

          # ---------- 3) 链接 ----------
          # 用 swiftc 当链接器驱动，它才会自动带上 Swift 运行时
          OBJS=$(find "$OBJ" -name '*.o' -print | sort | tr '\n' ' ')
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 -sdk "$SDK" -module-name XiangKe \
            -L "$SDK/usr/lib/swift" \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -o "$APP/XiangKe" $OBJS \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework UniformTypeIdentifiers \
            -framework BackgroundTasks \
            -framework Security \
            -framework AppIntents
          file "$APP/XiangKe"

          cp Sources/Info.plist "$APP/Info.plist"
          cp Resources/AppIcon*.png "$APP/"
          printf 'APPL????' > "$APP/PkgInfo"
          echo "--- app bundle ---"
          ls -la "$APP"

      - name: Extract App Intents metadata
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="$PWD/out/Payload/XiangKe.app"

          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"
          PROC="$TOOLCHAIN/usr/bin/appintentsmetadataprocessor"
          if [ ! -x "$PROC" ]; then
            PROC=$(find /Applications -name appintentsmetadataprocessor -type f 2>/dev/null | head -1)
          fi
          echo "processor = ${PROC:-<未找到>}"
          [ -x "$PROC" ] || { echo "❌ 找不到 appintentsmetadataprocessor"; exit 1; }

          # Xcode 15.4 的该工具要求 --xcode-version，且不支持 --bundle-identifier
          XCODE_VER=$(xcodebuild -version | awk '/Build version/{print $3}')
          echo "xcode-version = $XCODE_VER"

          # 源文件列表（绝对路径）
          ( cd Sources && ls *.swift ) | sed "s|^|$PWD/Sources/|" > build/SwiftFileList
          echo "--- Swift 源文件 ---"; cat build/SwiftFileList

          echo "--- 查找常量值 sidecar ---"
          find build -name '*.swiftconstvalues' -print || true

          CV="$PWD/build/obj/XiangKeIntent.swiftconstvalues"
          HAS_CV=0
          if [ -f "$CV" ]; then
            echo "$CV" > build/SwiftConstValuesFileList
            HAS_CV=1
            echo "✓ 有常量值 sidecar，可用编译期提取"
          else
            echo "· 无常量值 sidecar —— 走二进制提取（Xcode 15 的默认路径）"
          fi

          base_args() {
            "$PROC" \
              --toolchain-dir "$TOOLCHAIN" \
              --module-name XiangKe \
              --sdk-root "$SDK" \
              --xcode-version "$XCODE_VER" \
              --platform-family iOS \
              --deployment-target 16.0 \
              --output "$APP" \
              --target-triple arm64-apple-ios16.0 \
              --binary-file "$APP/XiangKe" \
              --source-file-list "$PWD/build/SwiftFileList" \
              --ignore-query-generics-errors \
              --force \
              "$@"
          }

          ok=0
          if [ "$HAS_CV" -eq 1 ]; then
            echo "===== 尝试：编译期提取（带常量值 sidecar）====="
            if base_args --swift-const-vals-list "$PWD/build/SwiftConstValuesFileList" \
                         --compile-time-extraction; then
              ok=1
            fi
          fi

          if [ "$ok" -ne 1 ]; then
            echo "===== 尝试：默认提取 ====="
            if base_args; then ok=1; fi
          fi

          if [ "$ok" -ne 1 ]; then
            echo "===== 尝试：legacy 提取（扫二进制）====="
            if base_args --legacy-extraction; then ok=1; fi
          fi

          if [ "$ok" -ne 1 ]; then
            echo "⚠️ 元数据未生成 —— App Intent 动作不会出现在快捷指令里。"
            echo "   构建继续：其余功能（URL Scheme / 后台刷新 / 锁屏探针）不受影响。"
            exit 0
          fi

          echo "--- Metadata.appintents ---"
          ls -la "$APP/Metadata.appintents" || { echo "❌ 没有产出 Metadata.appintents"; exit 1; }

          echo "--- actionsdata 内容检查 ---"
          if strings "$APP/Metadata.appintents/extract.actionsdata" 2>/dev/null \
               | grep -qi "XiangKeProbe"; then
            echo "✓ 元数据里找到 XiangKeProbeIntent"
          else
            echo "⚠️ 元数据里没找到 XiangKeProbeIntent"
          fi

      - name: Inject entitlements and package IPA
        run: |
          set -euo pipefail
          APP="out/Payload/XiangKe.app"
          ldid -Sentitlements.plist "$APP/XiangKe"
          echo "----- applied entitlements -----"
          ldid -e "$APP/XiangKe"
          if [ -d "$APP/Metadata.appintents" ]; then
            echo "✓ 包内含 App Intents 元数据"
          else
            echo "⚠️ 包内不含 App Intents 元数据（快捷指令里不会出现动作）"
          fi
          rm -f out/XiangKe.ipa
          cd out
          zip -qry XiangKe.ipa Payload
          ls -lh XiangKe.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiangKe-ipa
          path: out/XiangKe.ipa
          retention-days: 30
