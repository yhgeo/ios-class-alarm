name: Build PoC IPA

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.workbuddy-ai/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Compile with clang
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDK"
          APP="out/Payload/AlarmPoC.app"
          mkdir -p "$APP"
          SOURCES=$(find Sources -name '*.m' -print | sort | tr '\n' ' ')
          echo "源文件: $SOURCES"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=16.0 \
            -fobjc-arc \
            -O1 \
            -ISources \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework Security \
            -o "$APP/AlarmPoC" \
            $SOURCES
          cp Sources/Info.plist "$APP/Info.plist"
          printf 'APPL????' > "$APP/PkgInfo"
          echo "--- app bundle ---"
          ls -la "$APP"
          file "$APP/AlarmPoC"

      - name: Inject entitlements and package IPA
        run: |
          set -euo pipefail
          APP="out/Payload/AlarmPoC.app"
          ldid -Sentitlements.plist "$APP/AlarmPoC"
          echo "----- applied entitlements -----"
          ldid -e "$APP/AlarmPoC"
          rm -f out/AlarmPoC.ipa
          cd out
          zip -qry AlarmPoC.ipa Payload
          ls -lh AlarmPoC.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlarmPoC-ipa
          path: out/AlarmPoC.ipa
          retention-days: 30
