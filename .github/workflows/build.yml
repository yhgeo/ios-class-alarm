name: Build XiangKe IPA

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'DEVELOPMENT.md'
      - '.gitignore'
      - '.workbuddy-ai/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Compile ObjC + Swift
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDK"
          xcodebuild -version || true

          APP="out/Payload/XiangKe.app"
          OBJ="build/obj"
          rm -rf build
          mkdir -p "$APP" "$OBJ"

          # ---------- 1) ObjC → .o ----------
          # 改为逐个编译：Swift 那部分要单独编译，最后一起链接
          for f in $(find Sources -name '*.m' -print | sort); do
            echo "  clang $(basename "$f")"
            xcrun --sdk iphoneos clang \
              -arch arm64 -isysroot "$SDK" \
              -miphoneos-version-min=16.0 -fobjc-arc -O1 -ISources \
              -c "$f" -o "$OBJ/$(basename "$f" .m).o"
          done

          # ---------- 2) Swift → .o ----------
          # 尝试让编译器额外产出常量值 sidecar（.swiftconstvalues），
          # 它是「编译期提取」App Intents 元数据的输入。
          # 注意：该 flag 可能被接受却什么都不写，所以判断依据是「文件是否真的存在」，
          # 而不是退出码。
          CV="$OBJ/XiangKeIntent.swiftconstvalues"
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 -sdk "$SDK" -O \
            -module-name XiangKe -parse-as-library \
            -Xfrontend -emit-const-values-path -Xfrontend "$CV" \
            -c Sources/XiangKeIntent.swift -o "$OBJ/XiangKeIntent.o" \
            2> build/swift-err.log || true

          if [ -f "$CV" ]; then
            echo "✓ 已产出常量值 sidecar"
          elif [ -f "$OBJ/XiangKeIntent.o" ]; then
            echo "· 无 sidecar（此 Xcode 版本不产出），保留已编译对象"
          else
            echo "⚠️ 首次编译失败，退回普通编译："
            cat build/swift-err.log || true
            xcrun --sdk iphoneos swiftc \
              -target arm64-apple-ios16.0 -sdk "$SDK" -O \
              -module-name XiangKe -parse-as-library \
              -c Sources/XiangKeIntent.swift -o "$OBJ/XiangKeIntent.o"
          fi
          echo "--- objects ---"
          ls -la "$OBJ"

          # ---------- 3) 链接 ----------
          # 用 swiftc 当链接器驱动，它才会自动带上 Swift 运行时
          OBJS=$(find "$OBJ" -name '*.o' -print | sort | tr '\n' ' ')
          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 -sdk "$SDK" -module-name XiangKe \
            -L "$SDK/usr/lib/swift" \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            -o "$APP/XiangKe" $OBJS \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework UniformTypeIdentifiers \
            -framework BackgroundTasks \
            -framework Security \
            -framework AppIntents
          file "$APP/XiangKe"

          cp Sources/Info.plist "$APP/Info.plist"
          cp Resources/AppIcon*.png "$APP/"
          printf 'APPL????' > "$APP/PkgInfo"
          echo "--- app bundle ---"
          ls -la "$APP"

      - name: Extract App Intents metadata
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          APP="$PWD/out/Payload/XiangKe.app"

          TOOLCHAIN="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain"
          PROC="$TOOLCHAIN/usr/bin/appintentsmetadataprocessor"
          if [ ! -x "$PROC" ]; then
            PROC=$(find /Applications -name appintentsmetadataprocessor -type f 2>/dev/null | head -1)
          fi
          echo "processor = ${PROC:-<未找到>}"
          [ -x "$PROC" ] || { echo "❌ 找不到 appintentsmetadataprocessor"; exit 1; }

          # Xcode 15.4 的该工具要求 --xcode-version，且不支持 --bundle-identifier
          XCODE_VER=$(xcodebuild -version | awk '/Build version/{print $3}')
          echo "xcode-version = $XCODE_VER"

          # 源文件列表（绝对路径）
          ( cd Sources && ls *.swift ) | sed "s|^|$PWD/Sources/|" > build/SwiftFileList
          echo "--- Swift 源文件 ---"; cat build/SwiftFileList

          echo "--- 查找常量值 sidecar ---"
          find build -name '*.swiftconstvalues' -print || true

          CV="$PWD/build/obj/XiangKeIntent.swiftconstvalues"
          HAS_CV=0
          if [ -f "$CV" ]; then
            echo "$CV" > build/SwiftConstValuesFileList
            HAS_CV=1
            echo "✓ 有常量值 sidecar，可用编译期提取"
          else
            echo "· 无常量值 sidecar —— 走二进制提取（Xcode 15 的默认路径）"
          fi

          base_args() {
            "$PROC" \
              --toolchain-dir "$TOOLCHAIN" \
              --module-name XiangKe \
              --sdk-root "$SDK" \
              --xcode-version "$XCODE_VER" \
              --platform-family iOS \
              --deployment-target 16.0 \
              --output "$APP" \
              --target-triple arm64-apple-ios16.0 \
              --binary-file "$APP/XiangKe" \
              --source-file-list "$PWD/build/SwiftFileList" \
              --ignore-query-generics-errors \
              --force \
              "$@"
          }

          ok=0
          for mode in --legacy-extraction __default__; do
            echo "===== 尝试：$mode ====="
            if [ "$mode" = "__default__" ]; then
              if base_args; then ok=1; break; fi
            else
              if base_args "$mode"; then ok=1; break; fi
            fi
            echo "（该参数组合失败，继续下一种）"
          done

          if [ "$ok" -ne 1 ] && [ "$HAS_CV" -eq 1 ]; then
            echo "===== 尝试：编译期提取 ====="
            if base_args --swift-const-vals-list "$PWD/build/SwiftConstValuesFileList" \
                         --compile-time-extraction; then
              ok=1
            fi
          fi

          [ "$ok" -eq 1 ] || { echo "❌ 所有参数组合都失败"; exit 1; }

          echo "--- Metadata.appintents ---"
          ls -la "$APP/Metadata.appintents" || { echo "❌ 没有产出 Metadata.appintents"; exit 1; }

          echo "--- actionsdata 内容检查 ---"
          if strings "$APP/Metadata.appintents/extract.actionsdata" 2>/dev/null \
               | grep -qi "XiangKeProbe"; then
            echo "✓ 元数据里找到 XiangKeProbeIntent"
          else
            echo "⚠️ 元数据里没找到 XiangKeProbeIntent"
          fi

      - name: Inject entitlements and package IPA
        run: |
          set -euo pipefail
          APP="out/Payload/XiangKe.app"
          ldid -Sentitlements.plist "$APP/XiangKe"
          echo "----- applied entitlements -----"
          ldid -e "$APP/XiangKe"
          rm -f out/XiangKe.ipa
          cd out
          zip -qry XiangKe.ipa Payload
          ls -lh XiangKe.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiangKe-ipa
          path: out/XiangKe.ipa
          retention-days: 30
