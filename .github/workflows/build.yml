name: Build XiangKe IPA

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'DEVELOPMENT.md'
      - '.gitignore'
      - '.workbuddy-ai/**'
      - 'Experimental/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Compile with clang
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iOS SDK: $SDK"
          APP="out/Payload/XiangKe.app"
          mkdir -p "$APP"
          SOURCES=$(find Sources -name '*.m' -print | sort | tr '\n' ' ')
          echo "源文件: $SOURCES"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -miphoneos-version-min=16.0 \
            -fobjc-arc \
            -O1 \
            -ISources \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            -framework UniformTypeIdentifiers \
            -framework BackgroundTasks \
            -framework Security \
            -o "$APP/XiangKe" \
            $SOURCES
          cp Sources/Info.plist "$APP/Info.plist"
          cp Resources/AppIcon*.png "$APP/"
          printf 'APPL????' > "$APP/PkgInfo"
          echo "--- app bundle ---"
          ls -la "$APP"
          file "$APP/XiangKe"

      - name: Inject entitlements and package IPA
        run: |
          set -euo pipefail
          APP="out/Payload/XiangKe.app"
          ldid -Sentitlements.plist "$APP/XiangKe"
          echo "----- applied entitlements -----"
          ldid -e "$APP/XiangKe"
          rm -f out/XiangKe.ipa
          cd out
          zip -qry XiangKe.ipa Payload
          ls -lh XiangKe.ipa

      - name: Sign shortcut (best effort)
        run: |
          set -euo pipefail
          UNSIGNED="XiangKeAlarms.unsigned.shortcut"
          SIGNED="XiangKeAlarms.shortcut"
          rm -f "$SIGNED"

          if [ ! -f "$UNSIGNED" ]; then
            echo "没有 $UNSIGNED，跳过"
            exit 0
          fi

          SC=""
          for c in /usr/bin/shortcuts "$(xcrun --find shortcuts 2>/dev/null || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SC="$c"; break; fi
          done
          echo "shortcuts CLI = ${SC:-<未找到>}"

          signed_ok=0
          if [ -n "$SC" ]; then
            echo "=== 尝试签名 ==="
            if "$SC" sign --mode anyone --input "$UNSIGNED" --output "$SIGNED" 2>&1; then
              if [ -f "$SIGNED" ]; then signed_ok=1; fi
            fi
          fi

          if [ "$signed_ok" -eq 1 ]; then
            echo "✓ 签名成功"
          else
            echo "⚠️ 签名不可用 —— 回退到未签名版本（导入时需先在 设置→快捷指令 里"
            echo "   打开「允许不受信任的快捷指令」）"
            cp "$UNSIGNED" "$SIGNED"
          fi
          ls -la "$SIGNED"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: XiangKe-ipa
          path: out/XiangKe.ipa
          retention-days: 30

      - name: Upload shortcut
        uses: actions/upload-artifact@v4
        with:
          name: XiangKe-shortcut
          path: XiangKeAlarms*.shortcut
          retention-days: 30
